<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b1b" />
    <meta name="description" content="Celestial Vault — a little universe of games, art prints, trading cards, figures and treasured curiosities. Opening soon." />
    <title>Celestial Vault — Coming Soon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="splash">
      <header class="brand">
        <h1 class="site-title">Celestial Vault</h1>
      </header>

      <!-- Replace hero-placeholder.webp with your Photoshop artwork when it's ready. -->
      <div class="illustration">
        <img
          class="illustration__image"
          src="assets/preview.jpg"
          width="1440"
          height="807"
          alt="A winged girl among midnight-blue flowers and warm glowing lanterns"
        />
      </div>

      <section class="invitation" aria-labelledby="invitation-title">
        <p class="invitation__eyebrow"><span aria-hidden="true">✦</span> Opening Soon <span aria-hidden="true">✦</span></p>
        <h1 id="invitation-title">A universe of little treasures.</h1>
        <p class="invitation__description">
          An enchanted little archive of games, trading cards, art prints, figures and
          curiosities. I'm gathering the things I love under one celestial sky.
          The vault opens soon.
        </p>
      </section>

      <footer class="signature" aria-label="Collect, preserve, cherish">
        <span>Collect</span><span aria-hidden="true">✧</span>
        <span>Preserve</span><span aria-hidden="true">✧</span>
        <span>Cherish</span>
      </footer>
    </main>
  </body>
</html>
